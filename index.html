<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./assets/css/style.css">
  
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
  <main>
    <div class="profile">
      <div class="profile__user">
        <img src="./assets/images/avatar-jessica.jpeg" alt="User Avatar" class="profile__img">
        <div class="profile__name">Jessica Randall</div>
        <div class="profile__location">London, United Kingdom</div>
      </div>
      <p class="profile__bio">"Front-end developer and avid reader."</p>
      <nav class="profile__social-links">
        <a href="#">GitHub</a>
        <a href="#">Frontend Mentor</a>
        <a href="#">LinkedIn</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </nav>
    </div>
  </main>
</body>
</html>
